name: End-to-end

# Runs the whole product the way a person uses it: the three services in Docker, the demo data,
# the Next.js web app, and the check-in app's web build with a fake camera showing a real ticket.
on:
  pull_request:
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_URL: http://localhost:3000
      DOOR_APP_URL: http://localhost:3200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-python/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r backend-python/requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Start services
        run: |
          python3 scripts/init_local.py
          docker compose up --build -d --wait --wait-timeout 240 python go mailpit
      - name: Load demo data
        run: |
          python scripts/seed_demo.py
          docker compose exec -T python python -m app.cli set-role admin@biletflow.kz --role platform_admin

      - name: Build and start the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run start -- -p 3000 > ../web.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/events > /dev/null && break; sleep 2; done
      - name: Build the check-in app for the web
        working-directory: mobile
        env:
          EXPO_OFFLINE: '1'
          CI: '1'
        run: |
          npm ci
          npm run export:web

      - name: Run end-to-end tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            web.log
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 150 python go
      - name: Stop services
        if: always()
        run: docker compose down
