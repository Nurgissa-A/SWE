name: Backend quality
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: biletflow_test
          POSTGRES_USER: biletflow
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U biletflow -d biletflow_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://biletflow:${{ github.run_id }}@localhost:5432/biletflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-python/requirements.lock
      - run: python -m pip install -r backend-python/requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e backend-python
      - run: ruff check backend-python scripts
      - run: ruff format --check backend-python scripts
      - run: pytest backend-python/tests -v
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./... -v
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run api:lint
      - run: npm run api:types && git diff --exit-code -- frontend/src/lib/api-types.ts
      - name: Exercise Prism mock
        run: |
          npm run api:mock > /tmp/prism.log 2>&1 &
          PRISM_PID=$!
          trap 'kill "$PRISM_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS -X POST http://localhost:4010/api/auth/register -H 'Content-Type: application/json' -d '{"email":"mock@example.com","password":"mock-password-123"}' > /tmp/mock.json; then
              node -e 'const x=require("/tmp/mock.json");if(!x.id || !x.email)process.exit(1)'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/prism.log
          exit 1
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-python/requirements.lock
      - run: python -m pip install -r backend-python/requirements.lock
      - run: python3 scripts/init_local.py
      - run: docker compose up --build -d --wait --wait-timeout 180 python go
      - run: python scripts/smoke_identity.py
      - run: python scripts/smoke_integration.py
      - name: Diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail 100 migrate python go
      - name: Stop isolated CI services
        if: always()
        run: docker compose down
