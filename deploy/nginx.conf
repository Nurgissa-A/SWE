worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Routine logs deliberately omit URLs, query strings, IPs, bodies and tokens.
    log_format safe '$request_id $request_method $status $request_time';
    access_log /dev/stdout safe;
    server_tokens off;
    # Avoid persisting production HSTS policy for localhost development ports.
    proxy_hide_header Strict-Transport-Security;
    client_max_body_size 1m;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    limit_req_zone $binary_remote_addr zone=api:1m rate=10r/s;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream identity { zone identity 64k; server python:8000 resolve; }
    upstream business { zone business 64k; server go:8080 resolve; }
    upstream web { zone web 64k; server web:3000 resolve; }
    server {
        listen 8443 ssl;
        server_name localhost 127.0.0.1;
        ssl_certificate /run/tls/server.crt;
        ssl_certificate_key /run/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        # Local development CA only; no system trust installation is performed.
        location ^~ /internal { return 404; }
        location ~ ^/(api/(auth|users|organizer-profile|support|notifications|admin|event-images)(/|$)|\.well-known/jwks\.json$|docs$|redoc$|openapi\.json$|ready$|health$) {
            limit_req zone=api burst=30 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_pass http://identity;
        }
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_pass http://business;
        }
        location = /health/go {
            proxy_pass http://business/health;
        }
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://web;
        }
    }
}
