log_format local_safe '$request_method $status $request_time';
resolver 127.0.0.11 valid=5s ipv6=off;
upstream web_backend {
    zone web_backend 64k;
    server web:3000 resolve;
}
server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /run/tls/server.crt;
    ssl_certificate_key /run/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /dev/stdout local_safe;
    error_log /dev/null crit;
    proxy_hide_header Strict-Transport-Security;
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://web_backend;
    }
}
