services:
  postgres:
    ports: !reset []
  python:
    ports: !reset []
    environment:
      FRONTEND_URL: https://localhost:8443
  go:
    ports: !reset []
    environment:
      APP_URL: https://localhost:8443
  mailpit:
    ports: !override ["127.0.0.1:8025:8025"]
  web:
    build: ./frontend
    depends_on:
      python: {condition: service_healthy}
      go: {condition: service_healthy}
  gateway:
    image: nginx:stable-alpine@sha256:8eb2b5540eae779603cc3db84b3986a15ecb5308b54303146eee9837c137b51a
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.secrets/tls/server.key:/run/tls/server.key:ro
      - ./.secrets/tls/server.crt:/run/tls/server.crt:ro
    depends_on: [web]
