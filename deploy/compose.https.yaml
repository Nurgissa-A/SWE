# Requires Docker Compose 2.24+ for !reset. Uses locally generated CA/certificates.
services:
  postgres:
    ports: !reset []
  mailpit:
    ports: !reset []
  python:
    command: ["uvicorn","app.main:app","--host","0.0.0.0","--port","8000","--no-access-log","--proxy-headers","--forwarded-allow-ips=*"]
    image: ${IDENTITY_IMAGE:-biletflow-identity:local}
    environment:
      FRONTEND_URL: https://localhost:8443
      CORS_ORIGINS: '["https://localhost:8443"]'
    ports: !reset []
  migrate:
    image: ${IDENTITY_IMAGE:-biletflow-identity:local}
  db-bootstrap:
    image: ${IDENTITY_IMAGE:-biletflow-identity:local}
  db-permissions:
    image: ${IDENTITY_IMAGE:-biletflow-identity:local}
  notification-worker:
    image: ${IDENTITY_IMAGE:-biletflow-identity:local}
    environment:
      FRONTEND_URL: https://localhost:8443
  go:
    image: ${EVENTS_IMAGE:-biletflow-go:latest}
    ports: !reset []
  web:
    image: ${WEB_IMAGE:-biletflow-web:local}
    build:
      context: ./frontend
      args:
        RELEASE_COMMIT: ${RELEASE_COMMIT:-development}
    depends_on:
      python: {condition: service_healthy}
      go: {condition: service_started}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  gateway:
    image: nginx:stable-alpine@sha256:8eb2b5540eae779603cc3db84b3986a15ecb5308b54303146eee9837c137b51a
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    entrypoint: ["nginx","-c","/etc/nginx/nginx.conf","-g","daemon off;"]
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.secrets/tls/server.key:/run/tls/server.key:ro
      - ./.secrets/tls/server.crt:/run/tls/server.crt:ro
      - ./.secrets/tls/ca.crt:/run/tls/ca.crt:ro
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp:mode=1777
    depends_on:
      python: {condition: service_healthy}
      go: {condition: service_started}
      web: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl --cacert /run/tls/ca.crt -fsS -o /dev/null https://localhost:8443/ready && curl --cacert /run/tls/ca.crt -fsS -o /dev/null https://localhost:8443/health/go"]
      interval: 5s
      timeout: 5s
      retries: 20
