          - attendee
          - organizer
          - event_admin
          - platform_admin
        displayName:
          type: string
          nullable: true
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - email
      - role
      - displayName
      - emailVerified
      - createdAt
    OrganizerProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
          nullable: true
        payoutAccountPlaceholder:
          type: string
          nullable: true
