openapi: 3.0.3
info:
  title: BiletFlow API
  version: 0.3.0
  description: Shared identity, support, notifications, administration and Go business contract. Implementation
    status is explicit; planned Go routes are not completed functionality.
servers:
- url: http://localhost:8000
  description: Python identity/support/notifications/admin and private internal APIs
- url: http://localhost:8080
  description: Go Event service; /api/events only
- url: http://localhost:4010
  description: Prism development mock; no persistent state or real authentication
paths:
  /api/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 8
                  maxLength: 1024
              additionalProperties: false
      responses:
        '201':
          description: User created, verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/APIError'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '429':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Creates attendee and encrypted durable verification job atomically. SMTP failure leaves
        a visible retryable job, not a lost account. Delivery is asynchronous; normal response remains
        201.
      x-implementation-status: implemented
  /api/auth/verify-email:
    post:
      summary: Confirm an emailed verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 256
              additionalProperties: false
      responses:
        '200':
          description: Email verified
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Confirm an emailed verification token.
      x-implementation-status: implemented
  /api/auth/login:
    post:
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  maxLength: 1024
              additionalProperties: false
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                required:
                - token
                - user
        '401':
          $ref: '#/components/responses/APIError'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '429':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Verified active users authenticate with normalized email/password. Returns token and
        user; unverified accounts return 403. JWT role is a snapshot; current DB role/status is authoritative.
      x-implementation-status: implemented
  /api/auth/request-password-reset:
    post:
      summary: Trigger a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
              additionalProperties: false
      responses:
        '200':
          description: Reset email sent if the account exists
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '429':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Trigger a password reset email.
      x-implementation-status: implemented
  /api/auth/reset-password:
    post:
      summary: Complete a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - newPassword
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 256
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 1024
              additionalProperties: false
      responses:
        '200':
          description: Password updated
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Complete a password reset.
      x-implementation-status: implemented
  /api/users/me:
    get:
      summary: Get the current user's profile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Get the current user's profile.
      x-implementation-status: implemented
    patch:
      summary: Update the current user's basic profile fields
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 100
              additionalProperties: false
              required:
              - displayName
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Update the current user's basic profile fields.
      x-implementation-status: implemented
  /api/organizer-profile:
    post:
      summary: Create or complete the organizer profile for the current user
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contactEmail
              properties:
                contactEmail:
                  type: string
                  format: email
                  maxLength: 254
                contactPhone:
                  type: string
                  nullable: true
                  maxLength: 32
                  pattern: ^[+0-9 ()-]*$
                payoutAccountPlaceholder:
                  type: string
                  nullable: true
                  maxLength: 100
                  pattern: '^demo:'
                  description: Simulation label only, prefixed demo:. No real payout information.
              additionalProperties: false
              description: Verified attendee self-onboards as organizer for their own account. Event/Platform
                Admin roles cannot self-onboard. Repeated creation returns 409.
      responses:
        '201':
          description: Organizer profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfile'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Create or complete the organizer profile for the current user.
      x-implementation-status: implemented
    get:
      summary: Get the current user's organizer profile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfile'
        '404':
          $ref: '#/components/responses/APIError'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Get the current user's organizer profile.
      x-implementation-status: implemented
    patch:
      summary: Replace contact and simulation placeholder fields on own organizer profile
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contactEmail
              properties:
                contactEmail:
                  type: string
                  format: email
                  maxLength: 254
                contactPhone:
                  type: string
                  nullable: true
                  maxLength: 32
                  pattern: ^[+0-9 ()-]*$
                payoutAccountPlaceholder:
                  type: string
                  nullable: true
                  maxLength: 100
                  pattern: '^demo:'
                  description: Simulation label only, prefixed demo:. No real payout information.
              additionalProperties: false
              description: Verified attendee self-onboards as organizer for their own account. Event/Platform
                Admin roles cannot self-onboard. Repeated creation returns 409.
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfile'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Replace contact and simulation placeholder fields on own organizer profile.
      x-implementation-status: implemented
  /api/events:
    post:
      summary: Create a draft event
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - startsAt
              properties:
                title:
                  type: string
                description:
                  type: string
                  nullable: true
                category:
                  type: string
                  nullable: true
                startsAt:
                  type: string
                  format: date-time
                endsAt:
                  type: string
                  format: date-time
                  nullable: true
                venueId:
                  type: string
                  format: uuid
                  nullable: true
                visibility:
                  type: string
                  enum:
                  - public
                  - unlisted
                  - private
                  default: public
                capacity:
                  type: integer
                  nullable: true
      responses:
        '201':
          description: Draft event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
      tags:
      - events
      description: Create a draft event. Event ownership and visibility authorization are enforced by
        the JWT integration. PATCH, DELETE and unpublish are still pending Madi implementation.
      x-implementation-status: implemented
    get:
      summary: List events (own drafts for organizers, published events for others)
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - published
          - cancelled
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
      tags:
      - events
      description: List events (own drafts for organizers, published events for others). Event ownership
        and visibility authorization are enforced by the JWT integration. PATCH, DELETE and unpublish
        are still pending Madi implementation.
      x-implementation-status: implemented
  /api/events/{eventId}:
    get:
      summary: Get one event
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
      tags:
      - events
      description: Get one event. Event ownership and visibility authorization are enforced by the JWT
        integration. PATCH, DELETE and unpublish are still pending Madi implementation.
      x-implementation-status: implemented
    patch:
      summary: Edit a draft event
      security:
      - bearerAuth: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                startsAt:
                  type: string
                  format: date-time
                endsAt:
                  type: string
                  format: date-time
                capacity:
                  type: integer
                visibility:
                  type: string
                  enum:
                  - public
                  - unlisted
                  - private
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '409':
          description: Cannot edit a published event's core details
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
      tags:
      - events
      description: Edit a draft event. Event ownership and visibility authorization are enforced by the
        JWT integration. PATCH, DELETE and unpublish are still pending Madi implementation.
      x-implementation-status: planned
      servers:
      - url: http://localhost:8080
        description: Go-owned planned contract; not implemented on current main
    delete:
      summary: Cancel or delete a draft event
      security:
      - bearerAuth: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted or cancelled
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
      tags:
      - events
      description: Cancel or delete a draft event. Event ownership and visibility authorization are enforced
        by the JWT integration. PATCH, DELETE and unpublish are still pending Madi implementation.
      x-implementation-status: planned
      servers:
      - url: http://localhost:8080
        description: Go-owned planned contract; not implemented on current main
  /api/events/{eventId}/publish:
    post:
      summary: Publish a draft event
      security:
      - bearerAuth: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Event published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Event missing required fields for publishing
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
      tags:
      - events
      description: Publish a draft event. Event ownership and visibility authorization are enforced by
        the JWT integration. PATCH, DELETE and unpublish are still pending Madi implementation.
      x-implementation-status: implemented
  /api/events/{eventId}/unpublish:
    post:
      summary: Move a published event back to draft
      security:
      - bearerAuth: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Event unpublished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
      tags:
      - events
      description: Move a published event back to draft. Event ownership and visibility authorization
        are enforced by the JWT integration. PATCH, DELETE and unpublish are still pending Madi implementation.
      x-implementation-status: planned
      servers:
      - url: http://localhost:8080
        description: Go-owned planned contract; not implemented on current main
  /api/auth/resend-verification:
    post:
      tags:
      - identity
      summary: Resend Verification
      operationId: resend_verification_api_auth_resend_verification_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
        required: true
      responses:
        '200':
          description: Successful Response
        '422':
          $ref: '#/components/responses/APIError'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '429':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
      description: Resend Verification. Python-owned implementation with live identity and scoped permissions.
      x-implementation-status: implemented
  /api/auth/logout:
    post:
      tags:
      - identity
      summary: Logout
      operationId: logout_api_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '429':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
      security:
      - bearerAuth: []
      description: Logout. Python-owned implementation with live identity and scoped permissions.
      x-implementation-status: implemented
  /api/support/cases:
    post:
      tags:
      - platform
      summary: Create Case
      operationId: create_case_api_support_cases_post
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseInput'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'
        '422':
          $ref: '#/components/responses/APIError'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '429':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '200':
          description: Replay of the same idempotent request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'
      description: Create Case. Python-owned implementation with live identity and scoped permissions.
      x-implementation-status: implemented
    get:
      tags:
      - platform
      summary: List Cases
      operationId: list_cases_api_support_cases_get
      security:
      - bearerAuth: []
      parameters:
      - name: eventId
        in: query
        required: false
        schema:
          title: Eventid
          type: string
          format: uuid
          nullable: true
      - name: after
        in: query
        required: false
        schema:
          title: After
          type: string
          format: uuid
          nullable: true
      - name: limit
        in: query
        required: false
        schema:
          type: integer
