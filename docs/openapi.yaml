components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT with fixed issuer/audience, exp/iat/nbf, UUID sub/jti, role, ver and kid.
        Python checks live user status/token version; Go must also confirm live identity. Only public
        keys are shared.
    serviceAuth:
      type: http
      scheme: bearer
      description: Opaque internal service token. Server-to-server only.
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
