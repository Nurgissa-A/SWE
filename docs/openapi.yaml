openapi: 3.0.3
info:
  title: BiletFlow API
  version: 0.3.0
  description: Shared BiletFlow contract. Python serves identity (/api/auth, /api/users, /api/organizer-profile);
    Go serves the business API (events, ticket types, checkout, orders, check-in, promo, support, analytics,
    notifications, admin). All routes keep the /api prefix. Error responses carry a stable code that clients
    translate.
servers:
- url: http://localhost:8000
  description: Python identity service; /api/auth, /api/users, /api/organizer-profile only
- url: http://localhost:8080
  description: Go business service; every /api route except identity
- url: http://localhost:4010
  description: Prism development mock; no persistent state or real authentication
paths:
  /api/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 8
                  maxLength: 1024
              additionalProperties: false
      responses:
        '201':
          description: User created, verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/APIError'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Creates attendee only. Email is trimmed/lowercased. Extra fields including role or
        userId are rejected; email is sent through the configured adapter.
      x-implementation-status: implemented
  /api/auth/verify-email:
    post:
      summary: Confirm an emailed verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 256
              additionalProperties: false
      responses:
        '200':
          description: Email verified
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Confirm an emailed verification token.
      x-implementation-status: implemented
  /api/auth/logout:
    post:
      tags: [identity]
      summary: Sign out
      description: Revokes the current access token until its expiry. Other sessions remain active.
      security:
      - bearerAuth: []
      responses:
        '204': {description: Signed out}
        '401': {$ref: '#/components/responses/APIError'}
  /api/auth/login:
    post:
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  maxLength: 1024
              additionalProperties: false
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                required:
                - token
                - user
        '401':
          $ref: '#/components/responses/APIError'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Verified active users authenticate with normalized email/password. Returns token and
        user; unverified accounts return 403. JWT role is a snapshot; current DB role/status is authoritative.
      x-implementation-status: implemented
  /api/auth/request-password-reset:
    post:
      summary: Trigger a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
              additionalProperties: false
      responses:
        '200':
          description: Reset email sent if the account exists
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Trigger a password reset email.
      x-implementation-status: implemented
  /api/auth/reset-password:
    post:
      summary: Complete a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - newPassword
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 256
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 1024
              additionalProperties: false
      responses:
        '200':
          description: Password updated
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Complete a password reset.
      x-implementation-status: implemented
  /api/users/me:
    get:
      summary: Get the current user's profile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Get the current user's profile.
      x-implementation-status: implemented
    patch:
      summary: Update the current user's basic profile fields
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 100
                  nullable: true
                locale:
                  type: string
                  enum: [kk, ru, en]
              additionalProperties: false
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Update the current user's basic profile fields.
      x-implementation-status: implemented
  /api/users/lookup:
    get:
      tags: [identity]
      summary: Find an active verified account by exact email for staff assignment
      description: Organizers and platform administrators can look up verified active accounts.
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: email
        required: true
        schema: {type: string, minLength: 3, maxLength: 254}
      responses:
        '200':
          description: Staff directory account
          content:
            application/json:
              schema:
                type: object
                required: [id, email, displayName, locale]
                properties:
                  id: {type: string, format: uuid}
                  email: {type: string, format: email}
                  displayName: {type: string, nullable: true}
                  locale: {type: string, enum: [kk, ru, en]}
        '401': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
  /api/admin/users:
    get:
      tags: [identity]
      summary: Search accounts by email or display name as a platform administrator
      description: Returns a page of accounts matching the search term.
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: q
        schema: {type: string, maxLength: 254}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 100, default: 100}
      - in: query
        name: offset
        schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AdminUser'}
        '401': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
  /api/admin/users/{userId}:
    patch:
      tags: [identity]
      summary: Suspend or reactivate a non-platform-admin account
      description: Changes account status and invalidates existing sessions when the status changes.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: userId
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [isActive]
              properties:
                isActive: {type: boolean}
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '401': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
  /api/organizer-profile:
    post:
      summary: Create or complete the organizer profile for the current user
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contactEmail
              properties:
                contactEmail:
                  type: string
                  format: email
                  maxLength: 254
                contactPhone:
                  type: string
                  nullable: true
                  maxLength: 32
                  pattern: ^[+0-9 ()-]*$
                payoutAccountPlaceholder:
                  type: string
                  nullable: true
                  maxLength: 100
                  pattern: '^demo:'
                  description: Simulation label only, prefixed demo:. No real payout information.
              additionalProperties: false
              description: Verified attendee self-onboards as organizer for their own account. Event/Platform
                Admin roles cannot self-onboard. Repeated creation returns 409.
      responses:
        '201':
          description: Organizer profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfile'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Create or complete the organizer profile for the current user.
      x-implementation-status: implemented
    get:
      summary: Get the current user's organizer profile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfile'
        '404':
          $ref: '#/components/responses/APIError'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Get the current user's organizer profile.
      x-implementation-status: implemented
    patch:
      summary: Replace contact and simulation placeholder fields on own organizer profile
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contactEmail
              properties:
                contactEmail:
                  type: string
                  format: email
                  maxLength: 254
                contactPhone:
                  type: string
                  nullable: true
                  maxLength: 32
                  pattern: ^[+0-9 ()-]*$
                payoutAccountPlaceholder:
                  type: string
                  nullable: true
                  maxLength: 100
                  pattern: '^demo:'
                  description: Simulation label only, prefixed demo:. No real payout information.
              additionalProperties: false
              description: Verified attendee self-onboards as organizer for their own account. Event/Platform
                Admin roles cannot self-onboard. Repeated creation returns 409.
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfile'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Replace contact and simulation placeholder fields on own organizer profile.
      x-implementation-status: implemented
  /api/event-covers/{eventId}:
    parameters:
    - in: path
      name: eventId
      required: true
      schema: {type: string, format: uuid}
    put:
      tags: [identity]
      summary: Upload an event cover
      description: The owning organizer can upload a static cover for a public or unlisted event.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: {type: string, format: binary}
          image/png:
            schema: {type: string, format: binary}
          image/webp:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Cover saved
          content:
            application/json:
              schema:
                type: object
                required: [imageUrl]
                properties:
                  imageUrl: {type: string}
        '401': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '415': {$ref: '#/components/responses/APIError'}
        '422': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
    get:
      tags: [identity]
      summary: Read a visible event cover
      description: Returns a normalized WebP cover when the event is visible to an anonymous visitor.
      responses:
        '200':
          description: Event cover
          content:
            image/webp:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
  /api/events:
    post:
      summary: Create a draft event
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '201':
          description: Draft event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '429':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
      tags:
      - events
      description: Create a draft event owned by the authenticated organizer. Ownership and visibility
        are enforced by the JWT integration.
      x-implementation-status: implemented
    get:
      summary: List events
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - published
          - cancelled
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Search title, category, city or venue
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: city
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
        description: ISO date/time
      - name: to
        in: query
        required: false
        schema:
          type: string
        description: ISO date/time
      - name: mine
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: Organizer's own events only
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '429':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
      tags:
      - events
      description: Public catalogue of published public events (anonymous allowed); organizers also see
        their own events. Ownership and visibility are enforced by the JWT integration.
      x-implementation-status: implemented
      security:
      - {}
      - bearerAuth: []
  /api/events/{eventId}:
    get:
      summary: Get one event
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: key
        in: query
        required: false
        schema:
          type: string
        description: Private-event access key
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '429':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
      tags:
      - events
      description: Published public/unlisted events are public; private ones need key; drafts are owner-only.
        Ownership and visibility are enforced by the JWT integration.
      x-implementation-status: implemented
      security:
      - {}
      - bearerAuth: []
    patch:
      summary: Edit an event
      security:
      - bearerAuth: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '429':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
      tags:
      - events
      description: Partial update by the owner. Changing date, time or venue of a published event notifies
        ticket holders.
      x-implementation-status: implemented
    delete:
      summary: Delete a draft
      security:
      - bearerAuth: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '429':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
      tags:
      - events
      description: Only drafts without orders can be deleted.
      x-implementation-status: implemented
  /api/events/{eventId}/publish:
    post:
      summary: Publish a draft event
      security:
      - bearerAuth: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Event published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '429':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
      tags:
      - events
      description: Requires a verified e-mail, venue name and city, and at least one ticket type.
      x-implementation-status: implemented
  /api/events/{eventId}/unpublish:
    post:
      summary: Move a published event back to draft
      security:
      - bearerAuth: []
      parameters:
      - name: eventId
        in: path
