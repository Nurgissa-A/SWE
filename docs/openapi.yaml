openapi: 3.0.3
info:
  title: BiletFlow API
  version: 0.2.0
  description: Shared BiletFlow Auth/User/Profile and Event contract. Python identity routes are implemented;
    Event edit/delete/unpublish remain Go-owned planned operations. All routes preserve the /api prefix.
servers:
- url: http://localhost:8000
  description: Python identity service; /api/auth, /api/users, /api/organizer-profile only
- url: http://localhost:8080
  description: Go Event service; /api/events only
- url: http://localhost:4010
  description: Prism development mock; no persistent state or real authentication
paths:
  /api/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 8
                  maxLength: 1024
              additionalProperties: false
      responses:
        '201':
          description: User created, verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/APIError'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Creates attendee only. Email is trimmed/lowercased. Extra fields including role or
        userId are rejected; email is sent through the configured adapter.
  /api/auth/verify-email:
    post:
      summary: Confirm an emailed verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 256
              additionalProperties: false
      responses:
        '200':
          description: Email verified
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Confirm an emailed verification token.
  /api/auth/login:
    post:
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  maxLength: 1024
              additionalProperties: false
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                required:
                - token
                - user
        '401':
          $ref: '#/components/responses/APIError'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Verified active users authenticate with normalized email/password. Returns token and
        user; unverified accounts return 403. JWT role is a snapshot; current DB role/status is authoritative.
  /api/auth/request-password-reset:
    post:
      summary: Trigger a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
              additionalProperties: false
      responses:
        '200':
          description: Reset email sent if the account exists
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Trigger a password reset email.
  /api/auth/reset-password:
    post:
      summary: Complete a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - newPassword
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 256
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 1024
              additionalProperties: false
      responses:
        '200':
          description: Password updated
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Complete a password reset.
  /api/users/me:
    get:
      summary: Get the current user's profile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Get the current user's profile.
    patch:
      summary: Update the current user's basic profile fields
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 100
              additionalProperties: false
              required:
              - displayName
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Update the current user's basic profile fields.
  /api/organizer-profile:
    post:
      summary: Create or complete the organizer profile for the current user
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contactEmail
              properties:
                contactEmail:
                  type: string
                  format: email
                  maxLength: 254
                contactPhone:
                  type: string
                  nullable: true
                  maxLength: 32
                  pattern: ^[+0-9 ()-]*$
                payoutAccountPlaceholder:
                  type: string
                  nullable: true
                  maxLength: 100
                  pattern: '^demo:'
                  description: Simulation label only, prefixed demo:. No real payout information.
              additionalProperties: false
              description: Verified attendee self-onboards as organizer for their own account. Event/Platform
                Admin roles cannot self-onboard. Repeated creation returns 409.
      responses:
        '201':
          description: Organizer profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfile'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Create or complete the organizer profile for the current user.
    get:
      summary: Get the current user's organizer profile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfile'
        '404':
          $ref: '#/components/responses/APIError'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Get the current user's organizer profile.
    patch:
      summary: Replace contact and simulation placeholder fields on own organizer profile
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contactEmail
              properties:
                contactEmail:
                  type: string
                  format: email
                  maxLength: 254
                contactPhone:
                  type: string
                  nullable: true
                  maxLength: 32
                  pattern: ^[+0-9 ()-]*$
                payoutAccountPlaceholder:
                  type: string
                  nullable: true
                  maxLength: 100
                  pattern: '^demo:'
                  description: Simulation label only, prefixed demo:. No real payout information.
              additionalProperties: false
              description: Verified attendee self-onboards as organizer for their own account. Event/Platform
                Admin roles cannot self-onboard. Repeated creation returns 409.
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfile'
        '400':
          $ref: '#/components/responses/APIError'
        '401':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '422':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
      tags:
      - identity
      description: Replace contact and simulation placeholder fields on own organizer profile.
  /api/events:
    post:
      summary: Create a draft event
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - startsAt
              properties:
                title:
                  type: string
                description:
                  type: string
                  nullable: true
                category:
                  type: string
                  nullable: true
                startsAt:
                  type: string
                  format: date-time
                endsAt:
                  type: string
                  format: date-time
                  nullable: true
                venueId:
                  type: string
                  format: uuid
                  nullable: true
                visibility:
                  type: string
                  enum:
                  - public
                  - unlisted
                  - private
                  default: public
                capacity:
                  type: integer
                  nullable: true
      responses:
        '201':
          description: Draft event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
      tags:
      - events
      description: Create a draft event. Event ownership and visibility authorization are enforced by
        the JWT integration. PATCH, DELETE and unpublish are still pending Madi implementation.
    get:
      summary: List events (own drafts for organizers, published events for others)
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - published
          - cancelled
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
      tags:
      - events
      description: List events (own drafts for organizers, published events for others). Event ownership
        and visibility authorization are enforced by the JWT integration. PATCH, DELETE and unpublish
        are still pending Madi implementation.
  /api/events/{eventId}:
    get:
      summary: Get one event
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
      tags:
      - events
      description: Get one event. Event ownership and visibility authorization are enforced by the JWT
        integration. PATCH, DELETE and unpublish are still pending Madi implementation.
    patch:
      summary: Edit a draft event
      security:
      - bearerAuth: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                startsAt:
                  type: string
                  format: date-time
                endsAt:
                  type: string
                  format: date-time
                capacity:
                  type: integer
                visibility:
                  type: string
                  enum:
                  - public
                  - unlisted
                  - private
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '409':
          description: Cannot edit a published event's core details
      tags:
      - events
      description: Edit a draft event. Event ownership and visibility authorization are enforced by the
        JWT integration. PATCH, DELETE and unpublish are still pending Madi implementation.
    delete:
      summary: Cancel or delete a draft event
      security:
      - bearerAuth: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted or cancelled
      tags:
      - events
      description: Cancel or delete a draft event. Event ownership and visibility authorization are enforced
        by the JWT integration. PATCH, DELETE and unpublish are still pending Madi implementation.
  /api/events/{eventId}/publish:
    post:
      summary: Publish a draft event
      security:
      - bearerAuth: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Event published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Event missing required fields for publishing
      tags:
      - events
      description: Publish a draft event. Event ownership and visibility authorization are enforced by
        the JWT integration. PATCH, DELETE and unpublish are still pending Madi implementation.
  /api/events/{eventId}/unpublish:
    post:
      summary: Move a published event back to draft
      security:
      - bearerAuth: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Event unpublished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
      tags:
      - events
      description: Move a published event back to draft. Event ownership and visibility authorization
        are enforced by the JWT integration. PATCH, DELETE and unpublish are still pending Madi implementation.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT with fixed issuer/audience, exp/iat/nbf, UUID sub/jti, role, ver and kid.
        Python checks live user status/token version; Go must also confirm live identity. Only public
        keys are shared.
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - attendee
          - organizer
          - event_admin
          - platform_admin
        displayName:
          type: string
          nullable: true
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - email
      - role
      - displayName
      - emailVerified
      - createdAt
    OrganizerProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
          nullable: true
        payoutAccountPlaceholder:
          type: string
          nullable: true
      required:
      - id
      - userId
      - contactEmail
      - contactPhone
      - payoutAccountPlaceholder
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizerId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          nullable: true
        venueId:
          type: string
          format: uuid
          nullable: true
        visibility:
          type: string
          enum:
          - public
          - unlisted
          - private
        capacity:
          type: integer
          nullable: true
        status:
          type: string
          enum:
          - draft
          - published
          - cancelled
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    APIError:
      description: Request failed; no credential or request input echoed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
tags:
- name: identity
  description: Python-owned identity and organizer onboarding
- name: events
  description: Go-owned Event operations; see implementation status in api-contract.md
