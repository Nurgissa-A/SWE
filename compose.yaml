name: biletflow
services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: biletflow
      POSTGRES_USER: biletflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init_local.py first}
    ports:
    - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U biletflow -d biletflow
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: biletflow-identity:local
    build:
      context: ./backend-python
      args:
        RELEASE_COMMIT: ${RELEASE_COMMIT:-development}
    environment:
      DATABASE_URL: postgresql+psycopg://biletflow:${POSTGRES_PASSWORD}@postgres:5432/biletflow
      JWT_PRIVATE_KEY_FILE: /run/keys/jwt-private.pem
      JWT_PUBLIC_KEY_FILE: /run/keys/jwt-public.pem
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFICATION_KEY_FILE: /run/keys/notification.key
      SERVICE_TOKEN_FILE: /run/keys/service-token
      BUSINESS_URL: http://go:8080
      IMAGE_STORAGE_DIR: /srv/storage/event-images
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${PYTHON_CORS_ORIGINS:-["http://localhost:3000"]}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-10000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-3000}
    command:
    - alembic
    - upgrade
    - head
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
  python:
    user: ${LOCAL_UID:-10001}:${LOCAL_GID:-10001}
    image: biletflow-identity:local
    build:
      context: ./backend-python
      args:
        RELEASE_COMMIT: ${RELEASE_COMMIT:-development}
    environment:
      DATABASE_URL: postgresql+psycopg://biletflow_identity:${IDENTITY_DATABASE_PASSWORD:?Run scripts/init_local.py}@postgres:5432/biletflow
      JWT_PRIVATE_KEY_FILE: /run/keys/jwt-private.pem
      JWT_PUBLIC_KEY_FILE: /run/keys/jwt-public.pem
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFICATION_KEY_FILE: /run/keys/notification.key
      SERVICE_TOKEN_FILE: /run/keys/service-token
      BUSINESS_URL: http://go:8080
      IMAGE_STORAGE_DIR: /srv/storage/event-images
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${PYTHON_CORS_ORIGINS:-["http://localhost:3000"]}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-10000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-3000}
    ports:
    - 127.0.0.1:8000:8000
    volumes:
    - ./.secrets:/run/keys:ro
    - ./.storage/event-images:/srv/storage/event-images
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      notification-worker:
        condition: service_healthy
      db-permissions:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')
      interval: 5s
      timeout: 3s
      retries: 15
  notification-worker:
    user: ${LOCAL_UID:-10001}:${LOCAL_GID:-10001}
    image: biletflow-identity:local
    build:
      context: ./backend-python
      args:
        RELEASE_COMMIT: ${RELEASE_COMMIT:-development}
    environment:
      DATABASE_URL: postgresql+psycopg://biletflow_notifier:${NOTIFIER_DATABASE_PASSWORD}@postgres:5432/biletflow
      JWT_PRIVATE_KEY_FILE: /run/keys/jwt-private.pem
      JWT_PUBLIC_KEY_FILE: /run/keys/jwt-public.pem
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFICATION_KEY_FILE: /run/keys/notification.key
      SERVICE_TOKEN_FILE: /run/keys/service-token
      BUSINESS_URL: http://go:8080
      IMAGE_STORAGE_DIR: /srv/storage/event-images
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${PYTHON_CORS_ORIGINS:-["http://localhost:3000"]}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-10000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-3000}
    command:
    - python
    - -m
    - app.worker
    volumes:
    - ./.secrets/notification.key:/run/keys/notification.key:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      db-permissions:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - app.worker
      - --healthcheck
      interval: 10s
      timeout: 5s
      retries: 10
  go:
    build:
      context: ./backend-go
      args:
        RELEASE_COMMIT: ${RELEASE_COMMIT:-development}
    ports:
    - 127.0.0.1:8080:8080
    environment:
      JWT_PUBLIC_KEY_FILE: /run/keys/jwt-public.pem
      JWT_ISSUER: biletflow-identity
      JWT_AUDIENCE: biletflow-api
      JWT_KEY_ID: biletflow-local-1
      IDENTITY_URL: http://python:8000
      DATABASE_URL: postgresql://biletflow_events:${EVENTS_DATABASE_PASSWORD}@postgres:5432/biletflow
    volumes:
    - ./.secrets/jwt-public.pem:/run/keys/jwt-public.pem:ro
    depends_on:
      python:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
    - 127.0.0.1:8025:8025
    - 127.0.0.1:1025:1025
  prism:
    build:
      context: .
      dockerfile: tools/Dockerfile
    profiles:
    - tools
    command:
    - mock
    - -h
    - 0.0.0.0
    - /contracts/openapi.yaml
    volumes:
    - ./docs:/contracts:ro
    ports:
    - 127.0.0.1:${PRISM_PORT:-4010}:4010
  db-bootstrap:
    image: biletflow-identity:local
    build:
      context: ./backend-python
      args:
        RELEASE_COMMIT: ${RELEASE_COMMIT:-development}
    environment:
      DATABASE_URL: postgresql+psycopg://biletflow:${POSTGRES_PASSWORD}@postgres:5432/biletflow
      IDENTITY_DATABASE_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:?Run scripts/init_local.py}
      NOTIFIER_DATABASE_PASSWORD: ${NOTIFIER_DATABASE_PASSWORD:?Run scripts/init_local.py}
      EVENTS_DATABASE_PASSWORD: ${EVENTS_DATABASE_PASSWORD:?Run scripts/init_local.py}
    command:
    - python
    - -m
    - app.db.roles
    - bootstrap
    depends_on:
      postgres:
        condition: service_healthy
  db-permissions:
    image: biletflow-identity:local
    build:
      context: ./backend-python
      args:
        RELEASE_COMMIT: ${RELEASE_COMMIT:-development}
    environment:
      DATABASE_URL: postgresql+psycopg://biletflow:${POSTGRES_PASSWORD}@postgres:5432/biletflow
      IDENTITY_DATABASE_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:?Run scripts/init_local.py}
      NOTIFIER_DATABASE_PASSWORD: ${NOTIFIER_DATABASE_PASSWORD:?Run scripts/init_local.py}
      EVENTS_DATABASE_PASSWORD: ${EVENTS_DATABASE_PASSWORD:?Run scripts/init_local.py}
    command:
    - python
    - -m
    - app.db.roles
    - grant
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data: null
